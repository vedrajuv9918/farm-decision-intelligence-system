services:
  postgres:
    image: postgres:16-alpine
    container_name: farmwise-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmwise
    ports:
      - "5432:5432"
    volumes:
      - farmwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmwise"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  farmwise-postgres:
